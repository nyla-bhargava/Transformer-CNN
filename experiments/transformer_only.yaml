model:
  type: transformer
  input_encoding: one_hot
  d_model: 128
  num_heads: 4
  num_layers: 4
  dropout: 0.3

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.0003
  optimizer: adam

data:
  train_csv: data/raw/Proxy_TrainCV.csv
  val_csv: data/raw/Proxy_Val.csv
  test_csv: data/raw/TrueOT.csv

output:
  checkpoint_dir: models/transformer_only
  results_dir: results/transformer_only
